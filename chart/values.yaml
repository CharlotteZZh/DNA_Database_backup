# Default values; the image and registry credentials are set by .gitlab-ci.yml

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# GitLab deploy token (gitlab-deploy-token) used to pull the image
registry:
  server: ""
  username: ""
  password: ""

containerPort: 3838

# The app uses ~250 MB at idle (measured locally)
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

route:
  # Empty host lets OpenShift assign
  # <release>-<namespace>.apps.dksoprod-nc1.dhe.duke.edu
  host: ""

# Public vanity URL (e.g. dreamlanddb.duhs.duke.edu). Left empty until the
# DHTS DNS/firewall/load balancer requests are done; .gitlab-ci.yml fills
# host from the VANITY_HOST CI/CD variable. The certificate comes from
# cert-manager/Locksmith.
vanity:
  host: ""
  # Grouper support group that receives certificate notices
  # ("suppport" with three p's is the group's real address)
  issuerEmail: groups-dhts-academic-suppport-admins@duke.edu
