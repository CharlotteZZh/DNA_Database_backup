# Default values; the image and registry credentials are set by .gitlab-ci.yml

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# GitLab deploy token (gitlab-deploy-token) used to pull the image
registry:
  server: ""
  username: ""
  password: ""

containerPort: 3838

# The app uses ~250 MB at idle (measured locally)
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

route:
  # Empty host lets OpenShift assign
  # <release>-<namespace>.apps.dksoprod-nc1.dhe.duke.edu
  host: ""

# Public vanity URL (e.g. dreamlanddb.duhs.duke.edu). Left empty until the
# DHTS certificate/DNS/firewall/load balancer requests are done; .gitlab-ci.yml
# fills these from the VANITY_* CI/CD variables.
vanity:
  host: ""
  # PEM certificate with the full chain, and its private key
  certificate: ""
  key: ""
