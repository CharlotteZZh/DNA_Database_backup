{{- if .Values.vanity.host }}
# Public vanity URL. cert-manager fills in spec.tls.certificate/key from
# Locksmith and renews them automatically; see vanity-issuer.yaml
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-vanity
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
  annotations:
    cert-manager.io/issuer: locksmith-issuer
spec:
  host: {{ .Values.vanity.host }}
  to:
    kind: Service
    name: {{ .Release.Name }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
