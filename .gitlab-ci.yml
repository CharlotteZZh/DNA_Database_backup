# Build, scan and deploy MethylProphet DB to DKSO (OpenShift) using the DHTS CI templates.
# Requires in GitLab:
#   - CI/CD variable HELM_TOKEN (from the namespace email)
#   - Deploy token named gitlab-deploy-token with read_registry

stages:
  - build
  - scan
  - tag
  - deploy
  - decom

variables:
  APPLICATION_NAME: methylprophetdb
  RELEASE_NAME: methylprophetdb
  CLUSTER_SERVER: https://api.dksoprod-nc1.dhe.duke.edu:6443
  CLUSTER_NAMESPACE: inferred-dna-methylation-db
  # Each commit gets its own image tag so every deploy rolls out the new code
  THE_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

include:
  - project: 'utility/project-templates/ci-templates'
    file: '/docker-ci.yml'
  - project: 'utility/project-templates/ci-templates'
    file: '/helm-ci.yml'

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  extends: .kaniko_build

# CrowdStrike scan from the DHTS template. The script is copied from
# ci-templates docker-ci.yml (.crowdstrike_scan) because the template's last
# line is missing a closing brace ("exit ${FCS_EXIT:-0"), which makes every
# run fail. Drop this override once the template is fixed.
scan:
  extends: .crowdstrike_scan
  script:
    - if [[ -z ${THE_USER} ]]; then THE_USER=gitlab-ci-token ; fi
    - if [[ -z ${THE_PASSWORD} ]]; then THE_PASSWORD=$CI_JOB_TOKEN ; fi
    - echo scanning $THE_IMAGE
    - mkdir -p ${CI_PROJECT_DIR}/scan_results
    - WORK_DIR=$(mktemp -d)
    - export DOCKER_CONFIG=${WORK_DIR}/docker
    - crane auth login "$CI_REGISTRY" -u "$THE_USER" -p "$THE_PASSWORD" 2>&1 | grep -v -e "^WARNING" -e "credential" -e "docs.docker.com" || true
    - crane pull --platform linux/amd64 "$THE_IMAGE" ${WORK_DIR}/image.tar
    - rm -rf "$DOCKER_CONFIG"
    - fcs scan image ${WORK_DIR}/image.tar
      --falcon-region "us-1"
      --upload
      --minimum-severity $MINIMUM_SEVERITY
      --platform linux/amd64
      --format json
      --output ${CI_PROJECT_DIR}/scan_results/fcs_scan.json
      || FCS_EXIT=$?
    - rm -rf "$WORK_DIR"
    - cat ${CI_PROJECT_DIR}/scan_results/fcs_scan.json
    - if grep -Eq '"deny"[[:space:]]*:[[:space:]]*true' ${CI_PROJECT_DIR}/scan_results/fcs_scan.json ; then echo "CrowdStrike FCS policy denied image $THE_IMAGE" ; exit 1 ; fi
    - exit ${FCS_EXIT:-0}

tag:
  extends: .registry_image_tag
  variables:
    FROM_TAG: $CI_COMMIT_SHORT_SHA
    TO_TAG: latest

deploy:
  extends: .helm_deploy
  environment: production
  script:
    - helm upgrade --install $RELEASE_NAME ./chart
      --namespace $CLUSTER_NAMESPACE
      --history-max $MAX_HISTORY
      --set-string image.repository=$CI_REGISTRY_IMAGE
      --set-string image.tag=$CI_COMMIT_SHORT_SHA
      --set-string registry.server=$CI_REGISTRY
      --set-string registry.username=$CI_DEPLOY_USER
      --set-string registry.password=$CI_DEPLOY_PASSWORD
      --wait --timeout 10m
    - echo "App URL https://$(kubectl get route $RELEASE_NAME -o jsonpath='{.spec.host}')"

decom:
  extends: .helm_decom
  environment: production
